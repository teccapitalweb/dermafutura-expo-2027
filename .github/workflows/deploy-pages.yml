name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un solo despliegue a la vez; no cancela el que ya esté corriendo.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build estatico para congreso.dermalyssemx.com
        run: node scripts/build-gh-pages.mjs
        env:
          GH_PAGES_CUSTOM_DOMAIN: '1'

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
